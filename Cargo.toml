[package]
name = "claude-usage"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Live terminal monitor for Claude plan usage limits"
license = "MIT"

[[bin]]
name = "claude-usage"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
serde_json = "1"
dirs = "7"
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "3", features = ["json"] }
